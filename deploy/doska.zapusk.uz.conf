# /etc/nginx/sites-available/doska.zapusk.uz → sites-enabled. HTTPS'ni certbot qo'shadi: certbot --nginx -d doska.zapusk.uz
# HTTP/2 ni server-setup.sh certbot'dan keyin "listen 443 ssl http2" qilib yoqadi.
upstream uy_egalari { server 127.0.0.1:8211; keepalive 8; }

server {
    listen 80;
    listen [::]:80;
    server_name doska.zapusk.uz;

    access_log /var/log/nginx/doska-access.log;
    error_log  /var/log/nginx/doska-error.log;
    client_max_body_size 10m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    # SSE (/api/events) uzoq ochiq turadi — buferlash o'chiq, timeout katta
    location /api/events {
        proxy_pass http://uy_egalari;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    location / {
        proxy_pass http://uy_egalari;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
